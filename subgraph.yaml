specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Staker
    network: sei-mainnet
    source:
      address: "0x5f9e192B3c8d131715b0580ba5e376b9A074634c"
      abi: Staker
      startBlock: 172127729
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AutoCompoundUserSettingChanged
        - Claimed
        - Compound
        - Deposit
        - Discarded
        - DragonswapTokenPriceOracleSet
        - EnteredWithdrawal
        - InstantWithdraw
        - MarketplaceFeesSet
        - MinimumDepositSet
        - NewOffer
        - OfferRemoved
        - OwnershipTransferred
        - Purchase
        - RankRequirementsSet
        - RewardsIncreased
        - StakeManagerSet
        - Swept
        - TreasuryFeeSet
        - TreasurySet
        - Withdraw
        - WithdrawalPeriodChanged
      abis:
        - name: Staker
          file: ./abis/Staker.json
      eventHandlers:
        - event: AutoCompoundUserSettingChanged(indexed address,uint8)
          handler: handleAutoCompoundUserSettingChanged
        - event: Claimed(indexed address,uint8,uint256)
          handler: handleClaimed
        - event: Compound(indexed address,address,uint8,uint256,uint256)
          handler: handleCompound
        - event: Deposit(indexed address,uint256,uint256,uint256)
          handler: handleDeposit
        - event: Discarded(indexed address,uint256,uint256)
          handler: handleDiscarded
        - event: DragonswapTokenPriceOracleSet(indexed address)
          handler: handleDragonswapTokenPriceOracleSet
        - event: EnteredWithdrawal(indexed address,uint256,bool)
          handler: handleEnteredWithdrawal
        - event: InstantWithdraw(indexed address,uint256,uint256,uint256,bool)
          handler: handleInstantWithdraw
        - event: MarketplaceFeesSet(uint256,uint256)
          handler: handleMarketplaceFeesSet
        - event: MinimumDepositSet(uint256)
          handler: handleMinimumDepositSet
        - event: NewOffer(indexed address,uint256,uint256)
          handler: handleNewOffer
        - event: OfferRemoved(indexed address)
          handler: handleOfferRemoved
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Purchase(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handlePurchase
        - event: RankRequirementsSet(uint256[])
          handler: handleRankRequirementsSet
        - event: RewardsIncreased(uint8,uint256)
          handler: handleRewardsIncreased
        - event: StakeManagerSet(indexed address)
          handler: handleStakeManagerSet
        - event: Swept(indexed address,indexed address,uint256)
          handler: handleSwept
        - event: TreasuryFeeSet(uint256)
          handler: handleTreasuryFeeSet
        - event: TreasurySet(indexed address)
          handler: handleTreasurySet
        - event: Withdraw(indexed address,uint256)
          handler: handleWithdraw
        - event: WithdrawalPeriodChanged(uint256)
          handler: handleWithdrawalPeriodChanged
      file: ./src/staker.ts
