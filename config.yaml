# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
field_selection:
  transaction_fields:
    - hash
networks:
- id: 1329
  start_block: 173536573
  rpc_config:
    url: https://sei-mainnet.g.alchemy.com/v2/IYT-bnRbeVt8Bpi9MyhiL
  contracts:
  - name: Staker
    address:
    - 0xb71886c52D754CF2B1D3d866c7Cfe9eeC01418a7
    handler: src/EventHandlers.ts
    events:
    - event: AutoCompoundUserSettingChanged(address indexed account, uint8 newSelectedCompoundType)
    - event: Claimed(address indexed account, uint8 token, uint256 amount)
    - event: Compound(address indexed account, address compoundInitiatedBy, uint8 token, uint256 drgAmount, uint256 usdcAmount)
    - event: Deposit(address indexed funder, uint256 amount, uint256 pendingDragon, uint256 pendingUSDC)
    - event: Discarded(address indexed account, uint256 rewardsDragon, uint256 rewardsUSDC)
    - event: DragonswapTokenPriceOracleSet(address indexed dragonswapTokenPriceOracle)
    - event: EnteredWithdrawal(address indexed account, uint256 amount, bool emergency)
    - event: InstantWithdraw(address indexed account, uint256 unlockedAmount, uint256 redistributedToStakers, uint256 treasuryFee, bool emergency)
    - event: MarketplaceFeesSet(uint256 marketplaceFeeDragon, uint256 marketplaceFeeUSDC)
    - event: MinimumDepositSet(uint256 minimumDeposit)
    - event: NewOffer(address indexed seller, uint256 stake, uint256 price)
    - event: OfferRemoved(address indexed seller)
    - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
    - event: Purchase(address indexed buyer, address indexed seller, uint256 boughtAmount, uint256 price, uint256 feeDragon, uint256 feeUSDC)
    - event: RankRequirementsSet(uint256[] rankRequirements)
    - event: RewardsIncreased(uint8 t, uint256 amount)
    - event: StakeManagerSet(address indexed stakeManager)
    - event: Swept(address indexed token, address indexed to, uint256 amount)
    - event: TreasuryFeeSet(uint256 treasuryFee)
    - event: TreasurySet(address indexed treasury)
    - event: Withdraw(address indexed account, uint256 amount)
    - event: WithdrawalPeriodChanged(uint256 withdrawalPeriod)
unordered_multichain_mode: true
preload_handlers: true
